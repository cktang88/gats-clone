# fly.toml app configuration file generated for tinwar on 2026-10-10T00:12:33Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'tinwar'
primary_region = 'iad'
kill_signal = 'SIGTERM'
kill_timeout = '5m'

[build]

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'
  PORT = '8080'
  TRUST_PROXY = '1'

[[mounts]]
  source = 'skirmish_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '10s', interval = '15s', method = 'GET', path = '/healthz', timeout = '2s' }]
  concurrency = { hard_limit = 250, soft_limit = 200, type = 'connections' }

[[vm]]
  size = 'shared-cpu-8x'
  memory = '2048mb'
